name: Deploy BizForecast

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: BizForecast-complete.zip

      - name: Extract project
        run: |
          unzip -q BizForecast-complete.zip -d extracted
          cd extracted/bizforecast
          npm ci

      - name: Build application
        run: |
          cd extracted/bizforecast
          npm run build

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: extracted/bizforecast/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
